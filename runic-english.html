<!DOCTYPE html> <head></head>
<body>
	<style>
		main {
			display: grid;
			grid-template-columns: repeat(24, 1fr);
			gap: 1rem;
		}
		svg {
			height: auto;
			width: 100px;
		}
	</style>
	<main></main>
	<script>
		const BASE = 100

		const HEIGHT = BASE * 6
		const WIDTH = BASE * 3

		const PATHS = {
			// uppercase
			A: ['0,0 0,4', '2,1 2,4', '0,0 2,1', '0,1 2,2'],
			B: ['0,0 0,4 2,3 0,2 2,1 0,0'],
			C: ['2,0 0,2 2,4'],
			D: ['0,0 0,4 2,2 0,0'],
			E: ['2,0 0,2 2,2 0,2 2,4'],
			F: ['0,4 0,2 2,0 0,2 0,1 1,0 0,1 0,0'],
			G: ['2,1 2,0 0,2 2,4 2,2 1,2'],
			H: ['0,0 0,4', '2,0 2,4', '0,1 2,1', '0,2 2,2'],
			I: ['0,1 1,0 1,4 2,3'],
			J: ['2,0 2,4 0,3'],
			K: ['0,0 0,4', '2,0 0,2 2,4'],
			L: ['0,0 0,4 2,3'],
			M: ['0,0 0,4', '1,1 1,4', '2,0 2,4', '0,0 1,1 2,0'],
			N: ['0,0 0,4', '2,0 2,4', '0,1 2,3'],
			O: ['1,0 2,2 1,4 0,2 1,0'],
			P: ['0,0 0,4', '0,0 2,1 0,2'],
			Q: ['1,0 2,2 1,4 0,2 1,0', '1,2 2,4'],
			R: ['0,0 0,4', '2,4 0,2 2,1 0,0'],
			S: ['1.5,0 0.5,1.5 2,2.5 1,4'],
			T: ['0,1 1,0 2,1', '1,0 1,4'],
			U: ['0,0 0,4 2,2 2,0'],
			V: ['0,0 1,4 2,0'],
			W: ['0,0 0,3', '1,0 1,4', '2,0 2,3', '0,3 1,4 2,3'],
			X: ['0,0 2,4', '0,4 2,0'],
			Y: ['0,0 1,1 2,0', '1,1 1,4'],
			Z: ['0.5,0 1.5,1.5 0,2.5 1,4'],
			// lowercase
			a: ['2,2 2,3 1,2 0,3 1,4 2,3 2,4'],
			b: ['0,0 0,4 2,3 0,2'],
			c: ['2,2 0,3 2,4'],
			d: ['2,0 2,4 0,3 2,2'],
			e: ['2,2 0,3 2,3 0,3 2,4'],
			f: ['0,4 0,1 2,0 0,1 2,1'],
			f: ['0,4 0,2 1,0.5 0,2 1.5,2'],
			g: ['2,3 1,2 0,3 1,4 2,3 2,5 1,6 0,5'],
			h: ['0,0 0,4 0,2 2,4'],
			i: ['1,0 1,1', '1,2 1,4 2,3'],
			j: ['2,0 2,1', '2,2 2,5 1,6 0,5'],
			k: ['0,0 0,4 0,3 2,4 0,3 2,2'],
			l: ['0,0 0,4 1,3'],
			m: ['0,2 0,4', '1,2 1,4', '2,2 2,4', '0,2 2,2'],
			n: ['0,2 0,4', '0,2 2,3 2,4'],
			o: ['2,3 1,2 0,3 1,4 2,3'],
			p: ['0,4 2,3 0,2 0,6'],
			q: ['2,4 0,3 2,2 2,6'],
			r: ['0,1 0,4', '0,2 2,1'],
			s: ['2,2 0,3 2,3 0,4'],
			t: ['0,0 0,4 1,3', '0,2 1,2'],
			u: ['0,2 0,4 2,3 2,2'],
			v: ['0,2 1,4 2,2'],
			w: ['0,2 1,4 2,2', '1,2 1,4'],
			x: ['0,2 2,4', '0,4 2,2'],
			y: ['0,2 1,4', '0,6 2,2'],
			z: ['0,2 2,3 0,3 2,4'],
			// symbols
			'-': ['0,2 2,2'],
			':': ['1,0 1,1', '1,3 1,4'],
			'.': ['1,3 1,4'],
			' ': [],
		}

		const coords2svg = (lines) => {
			const svgLines = lines.map((coords) =>
				coords
					.map((coord) => coord.map((int) => int * BASE).join(','))
					.join(' ')
			)

			return `<svg viewBox="0 0 ${WIDTH} ${HEIGHT}" xmlns="http://www.w3.org/2000/svg" width="${WIDTH}" height="${HEIGHT}">
			<g style="fill:none; stroke: #000; stroke-width: 10;">
				${svgLines.map((svgCoords) => `<path d="M${svgCoords}" />`)}
			</g>
		</svg>`
		}

		const RUNES = Object.fromEntries(
			Object.entries(PATHS).map(([char, lines]) => {
				const svgLines = lines.map((path) =>
					path
						.split(' ')
						.map((coord) =>
							coord.split(',').map((txt) => parseFloat(txt))
						)
				)
				return [char, coords2svg(svgLines)]
			})
		)

		onload = () => {
			// preview of glyphs
			document.querySelector('main').innerHTML =
				Object.values(RUNES).join('\n') +
				'                Embers of the Nephilim: GHOST GIRL              AND THE                 GHOST GIANT             Andrew R. H. Quinn'
					.split('')
					.map((char) => RUNES[char])
					.join('\n')
		}
	</script>
</body>
